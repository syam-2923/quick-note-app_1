<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Quick Note Application</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <h1>📝 Quick Note Application</h1>

        <textarea
            id="noteInput"
            placeholder="Write your note here..."
        ></textarea>

        <button onclick="saveNote()">
            ➕ Save Note
        </button>

        <p id="message"></p>

        <h2>📋 Saved Notes</h2>

        <div id="notesList"></div>

    </div>

    <script src="script.js"></script>

</body>

</html>
